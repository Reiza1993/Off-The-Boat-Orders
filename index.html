<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA / mobile meta -->
  <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a"  media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OTB Orders">
  <meta name="description" content="Weekly supply order manager for Off The Boat Pizzeria">

  <title>Off The Boat — Orders</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <!-- Tailwind CSS (Play CDN — no build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            brand:   { DEFAULT: '#1e3a5f', light: '#2563eb' },
            surface: 'var(--color-surface)',
            border:  'var(--color-border)',
            text:    'var(--color-text)',
            muted:   'var(--color-text-muted)',
          },
          fontFamily: {
            sans: ['-apple-system', 'system-ui', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ── CSS custom properties for light/dark theming ── */
    :root {
      --color-bg:          #f8fafc;
      --color-surface:     #ffffff;
      --color-surface-2:   #f1f5f9;
      --color-text:        #0f172a;
      --color-text-muted:  #64748b;
      --color-border:      #e2e8f0;
      --color-brand:       #1e3a5f;
      --color-brand-light: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg:          #0f172a;
        --color-surface:     #1e293b;
        --color-surface-2:   #0f172a;
        --color-text:        #f1f5f9;
        --color-text-muted:  #94a3b8;
        --color-border:      #334155;
        --color-brand:       #1e40af;
        --color-brand-light: #3b82f6;
      }
    }

    /* ── Base reset ── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, system-ui, Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      /* Smooth momentum scrolling on iOS */
      -webkit-overflow-scrolling: touch;
    }

    /* Prevent input zoom on iOS/Android */
    input, textarea, select { font-size: 16px !important; }

    /* ── App layout ── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: calc(68px + env(safe-area-inset-bottom));
    }

    /* ── Sticky header ── */
    #app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-brand);
      color: #fff;
      padding: 12px 16px 12px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    #app-header .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    #app-header .subtitle {
      font-size: 11px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Screen management ── */
    .screen {
      display: none;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active { display: block; }

    /* ── Bottom nav ── */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 10px 4px;
      min-height: 56px;
      border: none;
      background: none;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
    .nav-btn .nav-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .nav-btn.nav-active { color: var(--color-brand-light); }
    .nav-btn.nav-active .nav-icon { transform: scale(1.1); }

    /* ── Reusable component styles ── */

    /* Cards */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 14px;
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #1e293b; }
    }

    /* Inputs */
    .input-field {
      width: 100%;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--color-text);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .input-field:focus {
      border-color: var(--color-brand-light);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .input-field::placeholder { color: var(--color-text-muted); }

    /* Quantity input — slightly larger touch target */
    .qty-input { padding: 14px; font-weight: 500; }

    /* Primary button */
    .btn-primary {
      background: var(--color-brand-light);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* Sticky bottom action bar */
    .sticky-bottom-action {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, var(--color-bg) 70%, transparent);
      padding: 12px 16px 16px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .badge-ok     { background: #dcfce7; color: #166534; }
    .badge-warn   { background: #fef3c7; color: #92400e; }
    .badge-miss   { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .badge-pin    { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-track  { background: #dbeafe; color: #1e40af; }
    @media (prefers-color-scheme: dark) {
      .badge-ok     { background: #14532d; color: #86efac; }
      .badge-warn   { background: #451a03; color: #fcd34d; }
      .badge-miss   { background: #1e293b; color: #94a3b8; border-color: #334155; }
      .badge-pin    { background: #451a03; color: #fcd34d; }
      .badge-danger { background: #450a0a; color: #fca5a5; }
      .badge-track  { background: #1e3a5f; color: #93c5fd; }
    }

    /* Divider */
    .divide-border > * + * { border-top: 1px solid var(--color-border); }

    /* Sticky section headers */
    .sticky-section-header {
      position: sticky;
      top: 0;
      background: var(--color-bg);
      padding: 8px 16px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-muted);
      z-index: 10;
      border-bottom: 1px solid var(--color-border);
    }

    /* Scrollbar (cosmetic, Chromium) */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 99px; }
  </style>
</head>

<body>
<div id="app">

  <!-- ── App header ── -->
  <header id="app-header">
    <div>
      <div class="logo">🚢 Off The Boat</div>
      <div class="subtitle" id="screen-title">Pizzeria Orders</div>
    </div>
    <div style="text-align:right">
      <div id="header-date" style="font-size:13px; font-weight:600; opacity:0.9"></div>
      <div style="font-size:10px; opacity:0.6; text-transform:uppercase; letter-spacing:0.5px">Orders</div>
    </div>
  </header>

  <!-- ── Screens ── -->

  <!-- New Order -->
  <div id="screen-new-order" class="screen"></div>

  <!-- Output -->
  <div id="screen-output" class="screen"></div>

  <!-- History -->
  <div id="screen-history" class="screen"></div>

  <!-- Tracking -->
  <div id="screen-tracking" class="screen"></div>

  <!-- Monthly Stats -->
  <div id="screen-stats" class="screen"></div>

  <!-- Backup / Restore -->
  <div id="screen-backup" class="screen"></div>

  <!-- Catalog Management -->
  <div id="screen-catalog" class="screen"></div>

</div><!-- /#app -->

<!-- ── Bottom navigation ── -->
<nav id="bottom-nav">
  <button class="nav-btn" data-nav="new-order" id="nav-new-order">
    <span class="nav-icon">✏️</span>
    <span class="nav-label">New Order</span>
  </button>
  <button class="nav-btn" data-nav="history" id="nav-history">
    <span class="nav-icon">📋</span>
    <span class="nav-label">History</span>
  </button>
  <button class="nav-btn" data-nav="tracking" id="nav-tracking">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Tracking</span>
  </button>
  <button class="nav-btn" data-nav="stats" id="nav-stats">
    <span class="nav-icon">📈</span>
    <span class="nav-label">Stats</span>
  </button>
  <button class="nav-btn" data-nav="catalog" id="nav-catalog">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Settings</span>
  </button>
</nav>

<!-- ── Confirm dialog overlay ── -->
<!-- display toggled via JS (inline style beats class in CSS cascade) -->
<div id="confirm-overlay"
  style="display:none;position:fixed;inset:0;z-index:300;align-items:flex-end;
         background:rgba(0,0,0,0.55);padding:0 0 calc(16px + env(safe-area-inset-bottom)) 0">
  <div style="background:var(--color-surface);border-radius:20px 20px 0 0;width:100%;padding:24px 20px;
              border-top:1px solid var(--color-border)">
    <p id="confirm-message" style="font-size:15px;font-weight:500;margin:0 0 20px;color:var(--color-text);line-height:1.4"></p>
    <div style="display:flex;gap:12px">
      <button id="confirm-cancel"
        style="flex:1;padding:14px;border-radius:14px;border:1px solid var(--color-border);
               background:var(--color-surface-2);color:var(--color-text);font-size:15px;font-weight:600;cursor:pointer">
        Cancel
      </button>
      <button id="confirm-ok"
        style="flex:1;padding:14px;border-radius:14px;border:none;
               background:#ef4444;color:white;font-size:15px;font-weight:700;cursor:pointer">
        Confirm
      </button>
    </div>
  </div>
</div>

<!-- ── App script (ES modules) ── -->
<script type="module" src="js/app.js"></script>

</body>
</html>
